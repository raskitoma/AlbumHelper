version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME:-album-helper}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - "${DB_DIR:-./data}:/app/data"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/figuritas.db
      # Public URL of the app (e.g. https://album.example.com), used in emailed links and redirects
      - APP_URL=${APP_URL:-}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: ${DOCKER_NETWORK:-album_network}
    external: true
